<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Embedded Photo Slideshow</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #111;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .slideshow {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: #111;
      overflow: hidden;
    }

    .slide-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #111;
      opacity: 0;
      transition: opacity 350ms ease-in-out;
    }

    .slide-img.active {
      opacity: 1;
      z-index: 2;
    }

    .slide-img.previous {
      opacity: 1;
      z-index: 1;
    }

    .loading,
    .error {
      color: white;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .counter {
      position: absolute;
      right: 14px;
      bottom: 10px;
      color: rgba(255,255,255,0.75);
      background: rgba(0,0,0,0.35);
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 13px;
      z-index: 10;
    }

    .nav-button {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  z-index: 20;

  width: 52px;
  height: 52px;

  border: none;
  border-radius: 50%;

  background: rgba(0,0,0,0.35);
  color: white;

  font-size: 26px;
  cursor: pointer;

  backdrop-filter: blur(4px);

  transition: background 0.2s ease;
}

.nav-button:hover {
  background: rgba(0,0,0,0.6);
}

.prev-button {
  left: 14px;
}

.next-button {
  right: 14px;
}

@media (max-width: 700px) {
  .nav-button {
    width: 44px;
    height: 44px;
    font-size: 22px;
  }
}
  </style>
</head>

<body>
  <div class="slideshow" id="slideshow">
    <div class="loading">Loading slideshow...</div>
  </div>

  <script>
  const IMAGE_JSON = "images.json";

  const SLIDE_TIME = 2200;
  const FADE_TIME = 300;
  const PRELOAD_AHEAD = 5;

  let images = [];
  let currentIndex = 0;
  let showingA = true;
  let slideshowInterval;

  let imgA;
  let imgB;
  let counter;

  async function startSlideshow() {
    const slideshow = document.getElementById("slideshow");

    try {
      const response = await fetch(IMAGE_JSON, {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("Could not load images.json");
      }

      images = await response.json();

      images = images
        .map(item => typeof item === "string" ? item : item.image)
        .filter(Boolean)
        .filter(src =>
          /\.(jpg|jpeg|png|gif|webp)$/i.test(src)
        );

      if (images.length === 0) {
        throw new Error("No images found");
      }

      shuffleArray(images);

      slideshow.innerHTML = "";

      imgA = document.createElement("img");
      imgB = document.createElement("img");

      imgA.className = "slide-img active";
      imgB.className = "slide-img";

      slideshow.appendChild(imgA);
      slideshow.appendChild(imgB);

      counter = document.createElement("div");
      counter.className = "counter";
      slideshow.appendChild(counter);

      createNavigationButtons(slideshow);

      imgA.src = images[0];

      updateCounter();
      preloadUpcomingImages();

      if (images.length > 1) {
        startAutoSlide();
      }

      setupKeyboardControls();

      setupClickControls(slideshow);

    } catch (error) {
      slideshow.innerHTML = `
        <div class="error">
          Slideshow could not be loaded.
        </div>
      `;

      console.error(error);
    }
  }

  function createNavigationButtons(slideshow) {
    const prevBtn = document.createElement("button");
    prevBtn.innerHTML = "❮";
    prevBtn.className = "nav-button prev-button";

    const nextBtn = document.createElement("button");
    nextBtn.innerHTML = "❯";
    nextBtn.className = "nav-button next-button";

    prevBtn.addEventListener("click", () => {
      previousSlide();
      restartAutoSlide();
    });

    nextBtn.addEventListener("click", () => {
      nextSlide();
      restartAutoSlide();
    });

    slideshow.appendChild(prevBtn);
    slideshow.appendChild(nextBtn);
  }

  function setupKeyboardControls() {
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight") {
        nextSlide();
        restartAutoSlide();
      }

      if (e.key === "ArrowLeft") {
        previousSlide();
        restartAutoSlide();
      }
    });
  }

  function setupClickControls(slideshow) {
    slideshow.addEventListener("click", (e) => {

      if (e.target.classList.contains("nav-button")) {
        return;
      }

      const x = e.clientX;
      const width = window.innerWidth;

      if (x > width / 2) {
        nextSlide();
      } else {
        previousSlide();
      }

      restartAutoSlide();
    });
  }

  function startAutoSlide() {
    slideshowInterval = setInterval(() => {
      nextSlide();
    }, SLIDE_TIME);
  }

  function restartAutoSlide() {
    clearInterval(slideshowInterval);
    startAutoSlide();
  }

  function nextSlide() {
    currentIndex = (currentIndex + 1) % images.length;
    changeSlide();
  }

  function previousSlide() {
    currentIndex =
      (currentIndex - 1 + images.length) % images.length;

    changeSlide();
  }

  function changeSlide() {
    const activeImg = showingA ? imgA : imgB;
    const nextImg = showingA ? imgB : imgA;

    nextImg.src = images[currentIndex];

    nextImg.onload = () => {
      activeImg.classList.remove("active");
      activeImg.classList.add("previous");

      nextImg.classList.remove("previous");
      nextImg.classList.add("active");

      setTimeout(() => {
        activeImg.classList.remove("previous");
      }, FADE_TIME);

      showingA = !showingA;

      updateCounter();
      preloadUpcomingImages();
    };
  }

  function preloadUpcomingImages() {
    for (let i = 1; i <= PRELOAD_AHEAD; i++) {

      const preloadIndex =
        (currentIndex + i) % images.length;

      const preloadImg = new Image();

      preloadImg.src = images[preloadIndex];
    }
  }

  function updateCounter() {
    counter.textContent =
      `${currentIndex + 1} / ${images.length}`;
  }

  function shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {

      const j = Math.floor(Math.random() * (i + 1));

      [array[i], array[j]] =
      [array[j], array[i]];
    }
  }

  startSlideshow();
</script>
</body>
</html>
