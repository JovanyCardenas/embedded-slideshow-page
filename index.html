```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>College Corps Photo Slideshow</title>

  <style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  padding: 0;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: transparent;

  font-family: Arial, sans-serif;
}

body {
  position: relative;
}

.slideshow {
  position: relative;

  width: 100%;
  height: 100%;

  overflow: hidden;

  background: transparent;

  touch-action: manipulation;
}

.slide-img {
  position: absolute;
  inset: 0;

  width: calc(100% - 120px);
  height: 100%;

  left: 60px;

  object-fit: contain;

  background: transparent;

  opacity: 0;

  transition:
    opacity 300ms ease-in-out,
    transform 300ms ease-in-out;

  transform: scale(1.01);

  will-change: opacity, transform;

  user-select: none;
  -webkit-user-drag: none;

  pointer-events: none;
}

.slide-img.active {
  opacity: 1;
  z-index: 2;
  transform: scale(1);
}

.slide-img.previous {
  opacity: 1;
  z-index: 1;
}

.loading,
.error {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  color: white;
  text-align: center;

  padding: 20px;
}

.counter {
  position: absolute;

  right: 16px;
  bottom: 14px;

  z-index: 30;

  color: rgba(255,255,255,0.9);

  background: rgba(0,0,0,0.35);

  padding: 7px 12px;

  border-radius: 999px;

  font-size: 13px;

  backdrop-filter: blur(6px);
}

.nav-button {
  position: absolute;

  top: 50%;
  transform: translateY(-50%);

  z-index: 40;

  width: 54px;
  height: 54px;

  border: none;
  border-radius: 50%;

  background: rgba(255,255,255,0.18);

  color: white;

  font-size: 26px;
  font-weight: bold;

  cursor: pointer;

  backdrop-filter: blur(8px);

  transition:
    background 0.2s ease,
    transform 0.2s ease,
    opacity 0.2s ease;

  box-shadow:
    0 4px 18px rgba(0,0,0,0.18);
}

.nav-button:hover {
  background: rgba(255,255,255,0.32);

  transform:
    translateY(-50%)
    scale(1.05);
}

.prev-button {
  left: 2px;
}

.next-button {
  right: 2px;
}

@media (max-width: 700px) {

  .slide-img {
    width: calc(100% - 80px);
    left: 40px;
  }

  .nav-button {
    width: 42px;
    height: 42px;

  }

  </style>
</head>

<body>

  <div class="slideshow" id="slideshow">
    <div class="loading">
      Loading slideshow...
    </div>
  </div>

  <script>

    const IMAGE_JSON = "images.json";

    const SLIDE_TIME = 2200;

    const PRELOAD_AHEAD = 6;

    let images = [];

    let currentIndex = 0;

    let showingA = true;

    let slideshowInterval;

    let imgA;
    let imgB;
    let counter;

    async function startSlideshow() {

      const slideshow =
        document.getElementById("slideshow");

      try {

        const response =
          await fetch(IMAGE_JSON, {
            cache: "no-store"
          });

        if (!response.ok) {
          throw new Error(
            "Could not load images.json"
          );
        }

        images = await response.json();

        images = images
          .map(item =>
            typeof item === "string"
              ? item
              : item.image
          )
          .filter(Boolean)
          .filter(src =>
            /\.(jpg|jpeg|png|gif|webp)$/i.test(src)
          );

        if (images.length === 0) {
          throw new Error("No images found");
        }

        shuffleArray(images);

        slideshow.innerHTML = "";

        imgA = createImageElement();
        imgB = createImageElement();

        imgA.classList.add("active");

        slideshow.appendChild(imgA);
        slideshow.appendChild(imgB);

        counter = document.createElement("div");
        counter.className = "counter";

        slideshow.appendChild(counter);

        createNavigationButtons(slideshow);

        imgA.src = images[0];

        updateCounter();

        preloadUpcomingImages();

        if (images.length > 1) {
          startAutoSlide();
        }

        setupKeyboardControls();

        setupClickControls(slideshow);

      } catch (error) {

        slideshow.innerHTML = `
          <div class="error">
            Slideshow could not be loaded.
          </div>
        `;

        console.error(error);
      }
    }

    function createImageElement() {

      const img =
        document.createElement("img");

      img.className = "slide-img";

      img.draggable = false;

      img.alt = "Slideshow image";

      return img;
    }

    function createNavigationButtons(slideshow) {

      const prevBtn =
        document.createElement("button");

      prevBtn.innerHTML = "❮";

      prevBtn.className =
        "nav-button prev-button";

      const nextBtn =
        document.createElement("button");

      nextBtn.innerHTML = "❯";

      nextBtn.className =
        "nav-button next-button";

      prevBtn.addEventListener("click", e => {
        e.stopPropagation();
        previousSlide();
        restartAutoSlide();
      });

      nextBtn.addEventListener("click", e => {
        e.stopPropagation();
        nextSlide();
        restartAutoSlide();
      });

      slideshow.appendChild(prevBtn);
      slideshow.appendChild(nextBtn);
    }

    function setupKeyboardControls() {

      document.addEventListener(
        "keydown",
        e => {

          if (e.key === "ArrowRight") {
            nextSlide();
            restartAutoSlide();
          }

          if (e.key === "ArrowLeft") {
            previousSlide();
            restartAutoSlide();
          }
        }
      );
    }

    function setupClickControls(slideshow) {

      slideshow.addEventListener(
        "click",
        e => {

          if (
            e.target.classList.contains(
              "nav-button"
            )
          ) {
            return;
          }

          const x = e.clientX;

          const width =
            window.innerWidth;

          if (x > width / 2) {
            nextSlide();
          } else {
            previousSlide();
          }

          restartAutoSlide();
        }
      );
    }

    function startAutoSlide() {

      slideshowInterval =
        setInterval(() => {

          nextSlide();

        }, SLIDE_TIME);
    }

    function restartAutoSlide() {

      clearInterval(slideshowInterval);

      startAutoSlide();
    }

    function nextSlide() {

      currentIndex =
        (currentIndex + 1) %
        images.length;

      changeSlide();
    }

    function previousSlide() {

      currentIndex =
        (currentIndex - 1 + images.length) %
        images.length;

      changeSlide();
    }

    function changeSlide() {

      const activeImg =
        showingA ? imgA : imgB;

      const nextImg =
        showingA ? imgB : imgA;

      nextImg.src =
        images[currentIndex];

      nextImg.onload = () => {

        activeImg.classList.remove(
          "active"
        );

        activeImg.classList.add(
          "previous"
        );

        nextImg.classList.remove(
          "previous"
        );

        nextImg.classList.add(
          "active"
        );

        setTimeout(() => {

          activeImg.classList.remove(
            "previous"
          );

        }, 300);

        showingA = !showingA;

        updateCounter();

        preloadUpcomingImages();
      };
    }

    function preloadUpcomingImages() {

      for (
        let i = 1;
        i <= PRELOAD_AHEAD;
        i++
      ) {

        const preloadIndex =
          (currentIndex + i) %
          images.length;

        const preloadImg =
          new Image();

        preloadImg.src =
          images[preloadIndex];
      }
    }

    function updateCounter() {

      counter.textContent =
        `${currentIndex + 1} / ${images.length}`;
    }

    function shuffleArray(array) {

      for (
        let i = array.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [array[i], array[j]] =
          [array[j], array[i]];
      }
    }

    startSlideshow();

  </script>

</body>
</html>
